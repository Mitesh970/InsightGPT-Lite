generate<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>InsightGPT Lite</title>
    <style>
      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        background: #101113;
        color: #f6f3ee;
        font-family: Arial, Helvetica, sans-serif;
      }

      .page {
        width: min(1100px, 100%);
        min-height: 100vh;
        margin: 0 auto;
        padding: 28px;
        display: flex;
        flex-direction: column;
        gap: 22px;
      }

      header {
        display: flex;
        justify-content: space-between;
        gap: 16px;
        align-items: end;
        border-bottom: 1px solid #2c3038;
        padding-bottom: 20px;
      }

      .eyebrow {
        margin: 0 0 6px;
        color: #c4b5fd;
        font-size: 14px;
        font-weight: 700;
      }

      h1 {
        margin: 0;
        font-size: clamp(32px, 5vw, 48px);
        letter-spacing: 0;
      }

      #status {
        color: #a8a29e;
        font-size: 14px;
        text-align: right;
      }

      .layout {
        display: grid;
        grid-template-columns: 320px 1fr;
        gap: 20px;
        flex: 1;
      }

      .panel {
        background: #181a1f;
        border: 1px solid #2c3038;
        border-radius: 8px;
      }

      .upload-panel {
        padding: 18px;
        height: fit-content;
      }

      .panel-title {
        margin: 0 0 16px;
        font-size: 16px;
        font-weight: 700;
      }

      input[type="file"] {
        width: 100%;
        min-height: 112px;
        border: 1px dashed #57534e;
        border-radius: 8px;
        background: #0c0d10;
        padding: 36px 14px;
        color: #d6d3d1;
      }

      button {
        border: 0;
        border-radius: 8px;
        cursor: pointer;
        font: inherit;
        font-weight: 700;
      }

      button:disabled {
        cursor: not-allowed;
        background: #44403c;
        color: #a8a29e;
      }

      .upload-btn {
        width: 100%;
        height: 46px;
        margin-top: 14px;
        background: #7c3aed;
        color: white;
      }

      .chat-panel {
        min-height: 610px;
        display: flex;
        flex-direction: column;
        overflow: hidden;
      }

      .chat-header {
        padding: 15px 18px;
        border-bottom: 1px solid #2c3038;
        font-weight: 700;
      }

      #messages {
        flex: 1;
        padding: 18px;
        display: flex;
        flex-direction: column;
        gap: 14px;
        overflow-y: auto;
      }

      .message {
        max-width: 82%;
        padding: 12px 14px;
        border-radius: 8px;
        line-height: 1.55;
        font-size: 14px;
        white-space: pre-wrap;
      }

      .assistant {
        background: #0c0d10;
        align-self: flex-start;
      }

      .user {
        background: #7c3aed;
        align-self: flex-end;
      }

      form {
        display: flex;
        gap: 12px;
        padding: 16px;
        border-top: 1px solid #2c3038;
      }

      #question {
        flex: 1;
        height: 48px;
        border: 1px solid #2c3038;
        border-radius: 8px;
        background: #0c0d10;
        color: white;
        outline: none;
        padding: 0 14px;
        font: inherit;
      }

      #question:focus {
        border-color: #a78bfa;
      }

      .send-btn {
        width: 92px;
        background: #7c3aed;
        color: white;
      }

      @media (max-width: 820px) {
        .page {
          padding: 18px;
        }

        header,
        .layout {
          display: flex;
          flex-direction: column;
          align-items: stretch;
        }

        #status {
          text-align: left;
        }

        .chat-panel {
          min-height: 540px;
        }
      }
    </style>
  </head>
  <body>
    <main class="page">
      <header>
        <div>
          <p class="eyebrow">Simple RAG Project</p>
          <h1>InsightGPT Lite</h1>
        </div>
        <div id="status">No PDF uploaded yet.</div>
      </header>

      <section class="layout">
        <aside class="panel upload-panel">
          <p class="panel-title">Document</p>
          <input id="pdf" type="file" accept="application/pdf" />
          <button id="upload" class="upload-btn" type="button">Upload PDF</button>
        </aside>

        <section class="panel chat-panel">
          <div class="chat-header">Chat</div>
          <div id="messages">
            <div class="message assistant">Upload a PDF, then ask me anything about it.</div>
          </div>
          <form id="chat-form">
            <input id="question" placeholder="Ask a question about the PDF" autocomplete="off" />
            <button class="send-btn" type="submit">Send</button>
          </form>
        </section>
      </section>
    </main>

    <script>
      const statusEl = document.querySelector("#status");
      const fileInput = document.querySelector("#pdf");
      const uploadButton = document.querySelector("#upload");
      const form = document.querySelector("#chat-form");
      const questionInput = document.querySelector("#question");
      const messages = document.querySelector("#messages");

      function addMessage(role, text) {
        const message = document.createElement("div");
        message.className = `message ${role}`;
        message.textContent = text;
        messages.appendChild(message);
        messages.scrollTop = messages.scrollHeight;
      }

      async function readResponse(response) {
        const text = await response.text();

        try {
          return JSON.parse(text);
        } catch {
          return {
            detail: text || "Server returned an empty response.",
          };
        }
      }

      uploadButton.addEventListener("click", async () => {
        const file = fileInput.files[0];

        if (!file) {
          statusEl.textContent = "Choose a PDF first.";
          return;
        }

        const formData = new FormData();
        formData.append("file", file);

        uploadButton.disabled = true;
        statusEl.textContent = "Indexing your PDF...";

        try {
          const response = await fetch("/upload", {
            method: "POST",
            body: formData,
          });
          const data = await readResponse(response);

          if (!response.ok) {
            throw new Error(data.detail || "Upload failed.");
          }

          statusEl.textContent = `${data.filename} indexed with ${data.chunks} chunks.`;
        } catch (error) {
          statusEl.textContent = error.message;
        } finally {
          uploadButton.disabled = false;
        }
      });

      form.addEventListener("submit", async (event) => {
        event.preventDefault();

        const question = questionInput.value.trim();
        if (!question) return;

        addMessage("user", question);
        questionInput.value = "";
        addMessage("assistant", "Thinking...");
        const loadingMessage = messages.lastChild;

        try {
          const response = await fetch("/chat", {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
            },
            body: JSON.stringify({ question }),
          });
          const data = await readResponse(response);

          if (!response.ok) {
            throw new Error(data.detail || "Could not answer that question.");
          }

          loadingMessage.textContent = data.answer;
        } catch (error) {
          loadingMessage.textContent = error.message;
        }
      });
    </script>
  </body>
</html>
